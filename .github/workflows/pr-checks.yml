name: PR Checks

on:
  pull_request:
    branches: [ main ]

# Cancel in-progress runs for the same PR when a new commit is pushed
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint · Build · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle  # handles ~/.gradle/caches and wrapper caching

      # google-services.json is gitignored; the mock file has a com.formulae.chef
      # entry and is safe for CI builds (no real Firebase project credentials).
      - name: Provide google-services.json
        run: cp mock-google-services.json vertexai/app/google-services.json

      # local.properties is gitignored; reconstruct it from repository secrets.
      #
      # Secrets expected (repo Settings → Secrets → Actions):
      #   CHEF_BACKEND_URL — base URL of chef-backend (not secret, but project-specific).
      # Optional for CI: the build and unit tests pass with an empty value.
      - name: Create local.properties
        run: echo 'chefBackendUrl=${{ secrets.CHEF_BACKEND_URL }}' >> local.properties

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Build debug APK
        run: ./gradlew :vertexai:app:assembleDebug

      - name: Unit tests
        run: ./gradlew :vertexai:app:testDebugUnitTest

      # Minifies the release build (unsigned) and runs verifyReleaseModelsKept, which fails if R8
      # stripped a model class that Firestore or Gson (de)serialize by reflection. Release builds
      # require a backend URL, so a placeholder is used when the secret is not set.
      - name: R8 model check (release)
        run: |
          grep -q '^chefBackendUrl=.' local.properties || echo 'chefBackendUrl=https://ci.invalid' >> local.properties
          ./gradlew :vertexai:app:minifyReleaseWithR8

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: vertexai/app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
